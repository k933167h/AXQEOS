name: Multi-Agent Pilot Gate
on:
  push:
    paths:
      - 'lab/multi_agent_gate.py'
      - 'lab/mock_review_adapter.py'
      - 'tests/test_multi_agent_gate.py'
      - 'tests/test_multi_agent_gate_integration.py'
      - 'tests/test_cli_review_adapter.py'
      - 'lab/cli_review_adapter.py'
      - 'lab/pilot_experiment.py'
      - 'tests/test_pilot_experiment.py'
      - '.github/workflows/multi-agent-pilot.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Unit and subprocess integration
        run: python -m pytest -q tests/test_multi_agent_gate.py tests/test_multi_agent_gate_integration.py tests/test_cli_review_adapter.py tests/test_pilot_experiment.py

name: Multi-Agent Pilot Gate
on:
  push:
    paths:
      - 'lab/multi_agent_gate.py'
      - 'lab/mock_review_adapter.py'
      - 'tests/test_multi_agent_gate.py'
      - 'tests/test_multi_agent_gate_integration.py'
      - 'tests/test_cli_review_adapter.py'
      - 'lab/cli_review_adapter.py'
      - 'lab/pilot_experiment.py'
      - 'lab/blind_benchmark.py'
      - 'lab/evidence_registry.py'
      - 'lab/sqlite_evidence.py'
      - 'lab/telemetry_outbox.py'
      - 'lab/atomic_evidence_outbox.py'
      - 'lab/leased_outbox_worker.py'
      - 'tests/test_leased_outbox_worker.py'
      - 'tests/test_observability_contract.py'
      - 'tests/test_atomic_evidence_outbox.py'
      - 'tests/test_sqlite_evidence.py'
      - 'tests/test_evidence_registry.py'
      - 'tests/test_blind_benchmark.py'
      - 'lab/seeded_oracle.py'
      - 'lab/seeded_review_adapter.py'
      - 'lab/fixtures/**'
      - 'tests/test_seeded_benchmark.py'
      - 'tests/test_pilot_experiment.py'
      - '.github/workflows/multi-agent-pilot.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Unit and subprocess integration
        run: python -m pytest -q tests/test_multi_agent_gate.py tests/test_multi_agent_gate_integration.py tests/test_cli_review_adapter.py tests/test_pilot_experiment.py tests/test_seeded_benchmark.py tests/test_blind_benchmark.py tests/test_evidence_registry.py tests/test_sqlite_evidence.py tests/test_atomic_evidence_outbox.py tests/test_leased_outbox_worker.py tests/test_observability_contract.py
